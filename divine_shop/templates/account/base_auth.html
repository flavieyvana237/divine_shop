{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Divine Shop{% endblock title %}</title>

  <link href="{% static 'css/output.css' %}" rel="stylesheet" />
  <link href="{% static 'css/project.css' %}" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400;1,700&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
</head>

<body class="bg-stone-50 antialiased">
  {% block auth_content %}{% endblock auth_content %}

  <script defer src="{% static 'js/alpine.min.js' %}"></script>
  {% block extra_js %}{% endblock extra_js %}
</body>
</html>
