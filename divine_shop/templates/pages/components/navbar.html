<nav class="fixed top-0 w-full z-50 bg-white/90 backdrop-blur-md border-b border-stone-100 transition-all duration-300">
  <div class="flex justify-between items-center px-6 py-4 w-full max-w-screen-2xl mx-auto">

    <!-- Logo -->
    <a href="{% url 'home' %}"
       class="text-2xl font-serif italic font-bold text-slate-900 tracking-tight">
      Divine<span class="text-amber-600">Shop</span>
    </a>

    <!-- Liens navigation -->
    <div class="hidden md:flex items-center space-x-8">
      <a href="{% url 'home' %}"
         class="{% if request.resolver_match.url_name == 'home' %}nav-link-active{% else %}nav-link{% endif %}">
        Home
      </a>
      <a href="{% url 'catalog:product_list' %}"
         class="{% if 'catalog' in request.resolver_match.namespace %}nav-link-active{% else %}nav-link{% endif %}">
        Shop
      </a>
      <a href="#featured_collection" class="nav-link">Collections</a>
      <a href="#" class="nav-link">About</a>
    </div>

    <!-- Actions droite -->
    <div class="flex items-center space-x-6">
      <div class="flex items-center space-x-4 text-slate-700 border-r border-stone-200 pr-4">

        <!-- ✅ Recherche — remplace l'ancien bouton search -->
        <div class="relative" x-data="{ open: false }">

          <!-- Icône search — clic pour ouvrir/fermer -->
          <button @click="open = !open; $nextTick(() => { if(open) $refs.searchInput.focus() })"
                  aria-label="Search"
                  class="hover:text-amber-600 transition p-1">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m21 21-4.34-4.34"/>
              <circle cx="11" cy="11" r="8"/>
            </svg>
          </button>

          <!-- Barre de recherche — s'ouvre au clic -->
          <div x-show="open"
               x-transition:enter="transition ease-out duration-200"
               x-transition:enter-start="opacity-0 scale-95"
               x-transition:enter-end="opacity-100 scale-100"
               x-transition:leave="transition ease-in duration-150"
               x-transition:leave-start="opacity-100 scale-100"
               x-transition:leave-end="opacity-0 scale-95"
               @click.outside="open = false"
               class="absolute right-0 top-0 w-80 bg-white rounded-2xl shadow-xl
                      border border-amber-600 overflow-hidden z-50">

            <!-- Input -->
            <div class="flex items-center gap-2 px-4 py-3 border-b border-stone-100">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                   viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2" class="text-stone-400 flex-shrink-0">
                <path d="m21 21-4.34-4.34"/>
                <circle cx="11" cy="11" r="8"/>
              </svg>
              <input type="text"
                     name="q"
                     placeholder="Rechercher un produit..."
                     class="flex-1 text-sm text-stone-700 placeholder-stone-400
                            outline-none bg-transparent"
                     hx-get="{% url 'catalog:product_search' %}"
                     hx-trigger="keyup changed delay:300ms"
                     hx-target="#search-results"
                     hx-swap="innerHTML"
                     autocomplete="off"
                     x-ref="searchInput"
                     @keydown.escape="open = false" />
            </div>

            <!-- Résultats injectés par HTMX -->
            <div id="search-results" class="max-h-80 overflow-y-auto"></div>

          </div>
        </div>
        <!-- ✅ Fin recherche -->

        <!-- Panier -->
        <button aria-label="Cart" class="relative hover:text-amber-600 transition p-1">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
               viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="8" cy="21" r="1" />
            <circle cx="19" cy="21" r="1" />
            <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12" />
          </svg>
          <span class="absolute top-0 right-0 flex h-4 w-4 items-center justify-center
                       bg-amber-600 text-[10px] text-white rounded-full">
            2
          </span>
        </button>

      </div>

      <!-- Login / Sign Up -->
      <div class="flex items-center space-x-5">
        <a href="#"
           class="text-xs font-semibold uppercase tracking-widest text-slate-600 hover:text-amber-600 transition">
          Login
        </a>
        <a href="#" class="btn-primary">Sign Up</a>
      </div>

    </div>
  </div>
</nav>
