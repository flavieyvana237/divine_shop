{% load static %}

<!DOCTYPE html>
<html class="light" lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {% block title %}
        Divine Shop
      {% endblock title %}
    </title>
    <!-- Tailwind CSS -->
    <link href="{% static 'css/output.css' %}" rel="stylesheet" />
    <link href="{% static 'css/project.css' %}" rel="stylesheet" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@400;700&family=Manrope:wght@300;400;500;600;700&display=swap"
          rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
          rel="stylesheet" />
    {% block extra_css %}
    {% endblock extra_css %}
  </head>
  <body class="{% block body_class %}{% endblock body_class %}">
    <!-- Navbar -->
    {% include "pages/components/navbar.html" %}
    <!-- Contenu principal de la page -->
    {% block body %}
    {% endblock body %}
    <!-- Footer -->
    {% include "pages/components/footer.html" %}
    <!-- Scripts -->
    <!-- ✅ Nouvelle ligne locale -->
    <script defer src="{% static 'js/alpine.min.js' %}"></script>
    <script src="{% static 'js/htmx.min.js' %}"></script>    {% block extra_js %}
    {% endblock extra_js %}
  </body>
</html>
